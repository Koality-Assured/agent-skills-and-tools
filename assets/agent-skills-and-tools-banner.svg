<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="auto" role="img" aria-label="Agent Skills and Tools Hero Banner">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bannerBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="35%" stop-color="#0E131F" />
      <stop offset="70%" stop-color="#070A11" />
      <stop offset="100%" stop-color="#030407" />
    </linearGradient>

    <!-- Radial Ambient Blooms -->
    <radialGradient id="leftAmberGlow" cx="20%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.32" />
      <stop offset="30%" stop-color="#D97706" stop-opacity="0.18" />
      <stop offset="65%" stop-color="#78350F" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rightAccentBloom" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.12" />
      <stop offset="45%" stop-color="#B45309" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="socketCoreGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="1" />
      <stop offset="25%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>

    <!-- Gold & Amber Linear Palettes -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FEF3C7" />
      <stop offset="80%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="amberAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="goldGradientPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="bladePlatinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="80%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Carbon Hardware Gradients -->
    <linearGradient id="carbonChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="bloomStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bloomSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Background Surface -->
  <rect width="1280" height="420" fill="url(#bannerBgGrad)" />

  <!-- Ambient Light Injections -->
  <rect width="1280" height="420" fill="url(#leftAmberGlow)" />
  <rect width="1280" height="420" fill="url(#rightAccentBloom)" />

  <!-- Technical Grid Matrix (Left & Right) -->
  <g stroke="#F59E0B" stroke-opacity="0.08" stroke-width="1">
    <!-- Vertical Guides -->
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="220" y1="0" x2="220" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="980" y1="0" x2="980" y2="420" />
    <line x1="1200" y1="0" x2="1200" y2="420" />
    <!-- Horizontal Guides -->
    <line x1="0" y1="70" x2="1280" y2="70" />
    <line x1="0" y1="210" x2="1280" y2="210" />
    <line x1="0" y1="350" x2="1280" y2="350" />
  </g>

  <!-- High-Precision Peripheral Frame Ticks & Accents -->
  <rect x="24" y="24" width="1232" height="372" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="32" y="32" width="1216" height="356" rx="12" fill="none" stroke="url(#amberAccentGrad)" stroke-width="1" stroke-dasharray="12 16" opacity="0.25" />

  <!-- Technical Corner Brackets -->
  <g stroke="#FBBF24" stroke-width="2" stroke-opacity="0.6" fill="none">
    <path d="M 40 58 L 40 40 L 58 40" />
    <path d="M 1240 58 L 1240 40 L 1222 40" />
    <path d="M 40 362 L 40 380 L 58 380" />
    <path d="M 1240 362 L 1240 380 L 1222 380" />
  </g>

  <!-- Top Accent Banner Line -->
  <line x1="320" y1="24" x2="960" y2="24" stroke="url(#amberAccentGrad)" stroke-width="2" opacity="0.8" />
  <circle cx="640" cy="24" r="3" fill="#FFFBEB" filter="url(#bloomSoft)" />

  <!-- 2. Left Hero Graphic: Modular Swiss Army & Socket Core Engine -->
  <g id="hero-socket-engine">
    <!-- Connecting Circuit Bus Lines to Satellite Blocks -->
    <g stroke="url(#amberAccentGrad)" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.6">
      <path d="M 220 210 L 85 110" />
      <path d="M 220 210 L 95 310" />
      <path d="M 220 210 L 355 90" />
      <path d="M 220 210 L 375 320" />
    </g>

    <!-- Satellite Skill Sockets (Floating Modular Capabilities) -->
    <!-- Socket 1: AST-GREP (Top-Left) -->
    <g transform="translate(50, 85)" filter="url(#cardShadow)">
      <rect width="70" height="42" rx="8" fill="url(#cardBgGrad)" stroke="#334155" stroke-width="1" />
      <rect x="4" y="4" width="62" height="34" rx="6" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="16" cy="21" r="4" fill="#FBBF24" filter="url(#bloomSoft)" />
      <text x="42" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#E2E8F0">AST</text>
    </g>

    <!-- Socket 2: WORKTREE ISOLATE (Bottom-Left) -->
    <g transform="translate(60, 285)" filter="url(#cardShadow)">
      <rect width="76" height="42" rx="8" fill="url(#cardBgGrad)" stroke="#334155" stroke-width="1" />
      <rect x="4" y="4" width="68" height="34" rx="6" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="16" cy="21" r="4" fill="#38BDF8" filter="url(#bloomSoft)" />
      <text x="46" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#E2E8F0">ISOLATE</text>
    </g>

    <!-- Socket 3: CLOUD / IAC (Top-Right) -->
    <g transform="translate(325, 65)" filter="url(#cardShadow)">
      <rect width="66" height="42" rx="8" fill="url(#cardBgGrad)" stroke="#334155" stroke-width="1" />
      <rect x="4" y="4" width="58" height="34" rx="6" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="16" cy="21" r="4" fill="#F59E0B" filter="url(#bloomSoft)" />
      <text x="41" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#E2E8F0">IAC</text>
    </g>

    <!-- Socket 4: BENCHMARK & COST (Bottom-Right) -->
    <g transform="translate(340, 295)" filter="url(#cardShadow)">
      <rect width="72" height="42" rx="8" fill="url(#cardBgGrad)" stroke="#334155" stroke-width="1" />
      <rect x="4" y="4" width="64" height="34" rx="6" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="16" cy="21" r="4" fill="#10B981" filter="url(#bloomSoft)" />
      <text x="44" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#E2E8F0">COST</text>
    </g>

    <!-- Concentric Orbit Reticles around Core Hub -->
    <circle cx="220" cy="210" r="140" fill="none" stroke="#F59E0B" stroke-opacity="0.1" stroke-dasharray="6 8" />
    <circle cx="220" cy="210" r="105" fill="none" stroke="#475569" stroke-opacity="0.3" />
    <circle cx="220" cy="210" r="70" fill="none" stroke="url(#goldGradientPrimary)" stroke-opacity="0.25" stroke-dasharray="3 5" />

    <!-- Core Articulated Blades radiating from Hub (Swiss Army Knife motif) -->
    <!-- Blade 1: Upward (Code Analysis Needle) -->
    <g transform="translate(220, 210) rotate(0)">
      <path d="M -9 -45 L -9 -115 L 0 -138 L 9 -115 L 9 -45 Z" fill="url(#bladePlatinum)" stroke="#475569" stroke-width="1.2" />
      <line x1="0" y1="-55" x2="0" y2="-120" stroke="url(#goldGradientPrimary)" stroke-width="2" />
      <circle cx="0" cy="-120" r="2.5" fill="#FFFBEB" filter="url(#bloomSoft)" />
    </g>

    <!-- Blade 2: 60 deg (Cloud / API Pin Socket) -->
    <g transform="translate(220, 210) rotate(60)">
      <path d="M -12 -45 L -12 -95 L 12 -95 L 12 -45 Z" fill="url(#carbonChassis)" stroke="#334155" stroke-width="1.2" />
      <rect x="-8" y="-115" width="4" height="20" rx="1" fill="url(#goldGradientPrimary)" />
      <rect x="4" y="-115" width="4" height="20" rx="1" fill="url(#goldGradientPrimary)" />
      <circle cx="0" cy="-75" r="3" fill="#F59E0B" filter="url(#bloomSoft)" />
    </g>

    <!-- Blade 3: 120 deg (Metric Caliper Blade) -->
    <g transform="translate(220, 210) rotate(120)">
      <path d="M -9 -45 L -9 -100 L 0 -120 L 10 -105 L 3 -85 L 3 -45 Z" fill="url(#bladePlatinum)" stroke="#475569" stroke-width="1.2" />
      <circle cx="0" cy="-95" r="2.5" fill="#FBBF24" />
    </g>

    <!-- Blade 4: 180 deg (Vault Lock Shank) -->
    <g transform="translate(220, 210) rotate(180)">
      <path d="M -12 -45 L -12 -95 L 0 -115 L 12 -95 L 12 -45 Z" fill="url(#carbonChassis)" stroke="url(#goldGradientPrimary)" stroke-width="1.2" />
      <circle cx="0" cy="-80" r="3" fill="#FBBF24" filter="url(#bloomSoft)" />
    </g>

    <!-- Blade 5: 240 deg (Mermaid / Reporting Stylus) -->
    <g transform="translate(220, 210) rotate(240)">
      <path d="M -9 -45 L -9 -100 L 0 -125 L 9 -100 L 9 -45 Z" fill="url(#bladePlatinum)" stroke="#475569" stroke-width="1.2" />
      <circle cx="0" cy="-90" r="2.5" fill="#FFFBEB" filter="url(#bloomSoft)" />
    </g>

    <!-- Blade 6: 300 deg (Security Sentinel Shield) -->
    <g transform="translate(220, 210) rotate(300)">
      <path d="M -12 -45 L -12 -95 L 0 -115 L 12 -95 L 12 -45 Z" fill="url(#carbonChassis)" stroke="#334155" stroke-width="1.2" />
      <path d="M -6 -75 L 0 -82 L 6 -75 L 6 -62 Q 0 -54 0 -50 Q 0 -54 -6 -62 Z" fill="#0F172A" stroke="url(#goldGradientPrimary)" stroke-width="1" />
    </g>

    <!-- Central Hexagonal Armor Chassis Hub -->
    <polygon points="220,145 276,177 276,243 220,275 164,243 164,177" fill="url(#carbonChassis)" stroke="#334155" stroke-width="3" />
    <polygon points="220,150 271,180 271,240 220,270 169,240 169,180" fill="none" stroke="url(#goldGradientPrimary)" stroke-width="1.5" stroke-opacity="0.85" />

    <!-- 6 Mechanical Peripheral Latches -->
    <circle cx="220" cy="156" r="3.5" fill="#F59E0B" />
    <circle cx="266" cy="183" r="3.5" fill="#F59E0B" />
    <circle cx="266" cy="237" r="3.5" fill="#F59E0B" />
    <circle cx="220" cy="264" r="3.5" fill="#F59E0B" />
    <circle cx="174" cy="237" r="3.5" fill="#F59E0B" />
    <circle cx="174" cy="183" r="3.5" fill="#F59E0B" />

    <!-- Inner Core Socket -->
    <circle cx="220" cy="210" r="42" fill="#07090E" stroke="url(#goldGradientPrimary)" stroke-width="2.5" />
    <circle cx="220" cy="210" r="28" fill="url(#socketCoreGlow)" filter="url(#bloomStrong)" />

    <!-- Center Interlocking Hub -->
    <circle cx="220" cy="210" r="16" fill="#18181B" stroke="#FDE68A" stroke-width="1.5" />
    <circle cx="220" cy="210" r="9" fill="url(#goldGradientPrimary)" />
    <circle cx="220" cy="210" r="4" fill="#FFFFFF" filter="url(#bloomSoft)" />
  </g>

  <!-- 3. Right Hero Content & Typography Section -->
  <g transform="translate(470, 0)">
    <!-- Metadata / Tagline Eyebrow Badge -->
    <g transform="translate(0, 52)">
      <rect width="470" height="26" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="url(#amberAccentGrad)" stroke-width="1" />
      <circle cx="14" cy="13" r="3.5" fill="#FBBF24" filter="url(#bloomSoft)" />
      <text x="26" y="17" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#FDE68A" letter-spacing="2">KOALITY-ASSURED • REUSABLE SKILLS ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#goldTextGrad)" letter-spacing="-0.5">AGENT SKILLS &amp; TOOLS</text>

    <!-- Subtitle -->
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="17" font-weight="500" fill="#CBD5E1">Standardized, Schema-Guaranteed Skill Catalog &amp; Sandboxed Execution</text>

    <!-- Description Paragraph -->
    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Curated library of 91+ verified agent skills, formal JSON Schema contracts, and validation tools</text>
    <text x="0" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">powering autonomous orchestration across multi-vendor AI coding agents.</text>

    <!-- Feature Pillars / Metric Indicator Cards (Row of 4) -->
    <g transform="translate(0, 248)">
      <!-- Card 1: 91+ Skills -->
      <g transform="translate(0, 0)" filter="url(#cardShadow)">
        <rect width="170" height="92" rx="10" fill="url(#cardBgGrad)" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="170" height="92" rx="10" fill="none" stroke="url(#amberAccentGrad)" stroke-width="1" opacity="0.35" />
        <!-- Top amber accent line -->
        <line x1="12" y1="0" x2="60" y2="0" stroke="#F59E0B" stroke-width="2.5" />
        <text x="16" y="32" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#FEF3C7">91+ SKILLS</text>
        <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#FBBF24">20 Domain Families</text>
        <text x="16" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#94A3B8">Vetted &amp; Indexed</text>
      </g>

      <!-- Card 2: Schema V2 -->
      <g transform="translate(186, 0)" filter="url(#cardShadow)">
        <rect width="170" height="92" rx="10" fill="url(#cardBgGrad)" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="170" height="92" rx="10" fill="none" stroke="url(#amberAccentGrad)" stroke-width="1" opacity="0.35" />
        <line x1="12" y1="0" x2="60" y2="0" stroke="#F59E0B" stroke-width="2.5" />
        <text x="16" y="32" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#FEF3C7">SCHEMA V2</text>
        <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#FBBF24">Draft 2020-12</text>
        <text x="16" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#94A3B8">Strict I/O Contracts</text>
      </g>

      <!-- Card 3: Isolation -->
      <g transform="translate(372, 0)" filter="url(#cardShadow)">
        <rect width="170" height="92" rx="10" fill="url(#cardBgGrad)" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="170" height="92" rx="10" fill="none" stroke="url(#amberAccentGrad)" stroke-width="1" opacity="0.35" />
        <line x1="12" y1="0" x2="60" y2="0" stroke="#F59E0B" stroke-width="2.5" />
        <text x="16" y="32" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#FEF3C7">ISOLATION</text>
        <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#FBBF24">Task Worktrees</text>
        <text x="16" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#94A3B8">Zero Mutation Leaks</text>
      </g>

      <!-- Card 4: Multi-Harness -->
      <g transform="translate(558, 0)" filter="url(#cardShadow)">
        <rect width="170" height="92" rx="10" fill="url(#cardBgGrad)" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="170" height="92" rx="10" fill="none" stroke="url(#amberAccentGrad)" stroke-width="1" opacity="0.35" />
        <line x1="12" y1="0" x2="60" y2="0" stroke="#F59E0B" stroke-width="2.5" />
        <text x="16" y="32" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#FEF3C7">PORTABLE</text>
        <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#FBBF24">Multi-Harness</text>
        <text x="16" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#94A3B8">Universal Agent Spec</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(0, 396)">
    <line x1="40" y1="0" x2="1240" y2="0" stroke="#1E293B" stroke-width="1" />
    <circle cx="60" cy="12" r="3" fill="#10B981" />
    <text x="72" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748B">ECOSYSTEM STATUS: OPERATIONAL</text>
    <text x="1220" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748B">SPEC VERSION 2.0.0</text>
  </g>
</svg>
